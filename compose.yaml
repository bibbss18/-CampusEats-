services:
  mysql:
    build: .docker/mysql
    container_name: mysql.campuseats
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: campuseats
      MYSQL_USER: user
      MYSQL_PASSWORD: user
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./.docker/mysql/utf8mb4.cnf:/etc/mysql/conf.d/utf8mb4.cnf:ro
      - ./.docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./database:/database:rw
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .docker/api
    stdin_open: true
    tty: true
    container_name: api.campuseats
    restart: unless-stopped
    working_dir: /campuseats/api
    # user: 1000:1000
    volumes:
      - ./:/campuseats
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: true
      CHOKIDAR_INTERVAL: 100
    depends_on:
      mysql:
        condition: service_healthy

  app:
    build: .docker/app
    stdin_open: true
    tty: true
    container_name: app.campuseats
    restart: unless-stopped
    working_dir: /campuseats/app
    # user: 1000:1000
    volumes:
      - ./:/campuseats
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: true
      CHOKIDAR_INTERVAL: 100

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin.campuseats
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - mysql

volumes:
  mysql_data:
    driver: local